<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0f1019"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#292e42" stroke-width="12"/>

  <!-- Terminal Header Dots -->
  <circle cx="90" cy="85" r="14" fill="#f7768e"/>
  <circle cx="130" cy="85" r="14" fill="#e0af68"/>
  <circle cx="170" cy="85" r="14" fill="#9ece6a"/>

  <!-- Command Prompt Symbol ❯ -->
  <path d="M90 170 L145 220 L90 270" fill="none" stroke="#7dcfff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neovim V Monogram -->
  <path d="M220 180 L295 350 L370 180" fill="none" stroke="url(#vGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Terminal Cursor Block -->
  <rect x="375" y="325" width="28" height="42" rx="4" fill="#ff9e64" opacity="0.9"/>
</svg>
